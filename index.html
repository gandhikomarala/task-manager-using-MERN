<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASKFLOW PRO — MERN Sprint & Task Management Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0B0E14;
  --panel: #11151F;
  --panel-raised: #161B27;
  --border: #232A3A;
  --border-soft: #1B212F;
  --text: #E7E9F0;
  --text-dim: #8A90A3;
  --text-faint: #565D72;
  --brand: #5B8DEF;
  --brand-glow: rgba(91, 141, 239, 0.25);
}

html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#root {
  min-height: 100vh;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- Header ---------- */

.app-header {
  border-bottom: 1px solid var(--border-soft);
  background: linear-gradient(180deg, #0D111A 0%, var(--bg) 100%);
  padding: 22px 32px 18px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: linear-gradient(135deg, #5B8DEF, #8C6CFF);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: white;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 8px 20px -6px var(--brand-glow);
}

.brand h1 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.02em;
  margin: 0;
}

.brand p {
  margin: 1px 0 0;
  font-size: 12px;
  color: var(--text-dim);
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.search-wrap {
  position: relative;
  flex-shrink: 0;
  width: 320px;
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  font-size: 14px;
}

.search-input {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 32px 8px 32px;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}

.search-input:focus {
  border-color: var(--brand);
}

.search-input::placeholder {
  color: var(--text-faint);
}

.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-faint);
  font-size: 16px;
  cursor: pointer;
  line-height: 1;
}

.filter-chips {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.chip-divider {
  width: 1px;
  height: 16px;
  background: var(--border);
  margin: 0 4px;
}

.filter-chip {
  font-size: 12px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
}

.filter-chip:hover {
  border-color: var(--text-faint);
  color: var(--text);
}

.filter-chip.active {
  font-weight: 600;
}

.filter-chip.clear {
  color: var(--text-faint);
  text-decoration: underline;
  border: none;
  padding-left: 4px;
}

.btn-primary {
  background: linear-gradient(135deg, #5B8DEF, #6E7CF5);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 14px -4px var(--brand-glow);
  transition: transform 0.1s, box-shadow 0.15s;
}

.btn-primary:hover {
  box-shadow: 0 6px 18px -4px var(--brand-glow);
  transform: translateY(-1px);
}

.btn-secondary {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

.btn-secondary:hover {
  color: var(--text);
  border-color: var(--text-faint);
}

/* ---------- Board ---------- */

.board {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, minmax(260px, 1fr));
  gap: 16px;
  padding: 22px 32px 32px;
  overflow-x: auto;
}

.column {
  background: var(--panel);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  min-height: 60vh;
  max-height: calc(100vh - 160px);
}

.column-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--border-soft);
}

.column-header h2 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin: 0;
  flex: 1;
  color: var(--text);
}

.column-count {
  font-size: 11px;
  color: var(--text-faint);
  background: var(--panel-raised);
  border-radius: 100px;
  padding: 2px 8px;
  font-family: "JetBrains Mono", monospace;
}

.column-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-backlog {
  background: #6b7280;
}
.dot-in-progress {
  background: #5b8def;
}
.dot-in-review {
  background: #d9a441;
}
.dot-completed {
  background: #51cf66;
}

.column-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.column-empty {
  font-size: 12px;
  color: var(--text-faint);
  text-align: center;
  padding: 24px 0;
}

/* ---------- Task card ---------- */

.task-card {
  background: var(--panel-raised);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 13px 11px;
  transition: border-color 0.15s, transform 0.1s;
}

.task-card:hover {
  border-color: #333c52;
}

.task-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.task-id {
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  color: var(--text-faint);
  letter-spacing: 0.02em;
}

.task-remove {
  background: none;
  border: none;
  color: var(--text-faint);
  font-size: 15px;
  cursor: pointer;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 4px;
}

.task-remove:hover {
  color: #ff6b6b;
  background: rgba(255, 107, 107, 0.1);
}

.task-title {
  font-size: 13.5px;
  font-weight: 600;
  margin: 0 0 6px;
  line-height: 1.35;
  color: var(--text);
}

.task-criteria {
  font-size: 11.5px;
  color: var(--text-dim);
  line-height: 1.45;
  margin: 0 0 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.task-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.chip {
  font-size: 10.5px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 100px;
  letter-spacing: 0.01em;
}

.task-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.task-assignee {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--border);
  color: var(--text-dim);
  font-size: 10px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.task-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.advance-btn {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--brand);
  font-size: 11px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.12s;
}

.advance-btn:hover {
  background: var(--brand-glow);
  border-color: var(--brand);
}

.advance-btn.ghost {
  color: var(--text-faint);
  padding: 5px 8px;
}

.advance-btn.ghost:hover {
  color: var(--text-dim);
  background: var(--panel-raised);
  border-color: var(--border);
}

.done-label {
  font-size: 11px;
  font-weight: 600;
  color: #51cf66;
}

/* ---------- Modal ---------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 10, 0.72);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
}

.modal {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 100%;
  max-width: 460px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.6);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border-soft);
}

.modal-header h2 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 16px;
  margin: 0;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-faint);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
}

.modal-close:hover {
  color: var(--text);
}

.modal-form {
  padding: 18px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field span {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
}

.field input,
.field select,
.field textarea {
  background: var(--panel-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 11px;
  font-size: 13px;
  color: var(--text);
  outline: none;
  font-family: inherit;
  resize: vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--brand);
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-error {
  font-size: 12px;
  color: #ff6b6b;
  background: rgba(255, 107, 107, 0.08);
  border: 1px solid rgba(255, 107, 107, 0.25);
  border-radius: 8px;
  padding: 8px 11px;
  margin: 0;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 4px;
}

/* ---------- Scrollbars ---------- */

.column-body::-webkit-scrollbar,
.modal::-webkit-scrollbar {
  width: 8px;
}

.column-body::-webkit-scrollbar-thumb,
.modal::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}

/* ---------- Responsive ---------- */

@media (max-width: 1000px) {
  .board {
    grid-template-columns: 1fr;
  }
  .search-wrap {
    width: 100%;
  }
}

  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const COLUMNS = [
      { id: "backlog", label: "Backlog" },
      { id: "in-progress", label: "In Progress" },
      { id: "in-review", label: "In Review" },
      { id: "completed", label: "Completed" },
    ];

    const NEXT_COLUMN = {
      backlog: "in-progress",
      "in-progress": "in-review",
      "in-review": "completed",
      completed: null,
    };

    const PREV_COLUMN = {
      backlog: null,
      "in-progress": "backlog",
      "in-review": "in-progress",
      completed: "in-review",
    };

    const PRIORITIES = [
      { id: "Urgent", color: "#FF4D5E", bg: "rgba(255,77,94,0.14)" },
      { id: "High", color: "#FF9F43", bg: "rgba(255,159,67,0.14)" },
      { id: "Medium", color: "#FFD43B", bg: "rgba(255,212,59,0.14)" },
      { id: "Low", color: "#51CF66", bg: "rgba(81,207,102,0.14)" },
    ];

    const CATEGORIES = [
      { id: "Backend", color: "#8C6CFF", bg: "rgba(140,108,255,0.14)" },
      { id: "Frontend", color: "#4DABF7", bg: "rgba(77,171,247,0.14)" },
      { id: "DevOps", color: "#20C997", bg: "rgba(32,201,151,0.14)" },
      { id: "Security", color: "#FF6B9D", bg: "rgba(255,107,157,0.14)" },
    ];

    const SEED_TASKS = [
      {
        id: "TF-101",
        title: "Set up CI pipeline for staging deploys",
        acceptanceCriteria: "Every push to main triggers a build, test run, and staging deploy.",
        priority: "High",
        category: "DevOps",
        assignee: "Rahul Nair",
        status: "backlog",
        createdAt: Date.now() - 1000 * 60 * 60 * 24 * 3,
      },
      {
        id: "TF-102",
        title: "Design token audit for dashboard components",
        acceptanceCriteria: "All spacing, color, and type tokens documented in one source of truth.",
        priority: "Low",
        category: "Frontend",
        assignee: "Priya Menon",
        status: "backlog",
        createdAt: Date.now() - 1000 * 60 * 60 * 24 * 2,
      },
      {
        id: "TF-103",
        title: "Rate-limit the public API",
        acceptanceCriteria: "Requests over 100/min per API key return 429 with retry-after header.",
        priority: "Urgent",
        category: "Security",
        assignee: "Owen Clarke",
        status: "in-progress",
        createdAt: Date.now() - 1000 * 60 * 60 * 24 * 4,
      },
      {
        id: "TF-104",
        title: "Migrate session store to Redis",
        acceptanceCriteria: "Sessions survive a server restart; login state unaffected during rollout.",
        priority: "Medium",
        category: "Backend",
        assignee: "Owen Clarke",
        status: "in-review",
        createdAt: Date.now() - 1000 * 60 * 60 * 24 * 5,
      },
      {
        id: "TF-105",
        title: "Add empty states to reporting screens",
        acceptanceCriteria: "New workspaces show helpful empty states instead of blank charts.",
        priority: "Low",
        category: "Frontend",
        assignee: "Priya Menon",
        status: "completed",
        createdAt: Date.now() - 1000 * 60 * 60 * 24 * 6,
      },
      {
        id: "TF-106",
        title: "Document webhook payload schemas",
        acceptanceCriteria: "Public docs include JSON schemas and sample payloads for all 8 events.",
        priority: "Medium",
        category: "Backend",
        assignee: "Rahul Nair",
        status: "completed",
        createdAt: Date.now() - 1000 * 60 * 60 * 24 * 7,
      },
    ];

    function findMeta(list, id) {
      return list.find((item) => item.id === id) || null;
    }

    function initials(name) {
      if (!name) return "??";
      return name.split(" ").map((n) => n[0]).join("").slice(0, 2).toUpperCase();
    }

    function nextTaskId(tasks) {
      const max = tasks.reduce((acc, t) => {
        const m = t.id.match(/^TF-(\d+)$/);
        return m ? Math.max(acc, Number(m[1])) : acc;
      }, 100);
      return `TF-${max + 1}`;
    }

    function TaskCard({ task, onAdvance, onRetreat, onRemove }) {
      const priority = findMeta(PRIORITIES, task.priority);
      const category = findMeta(CATEGORIES, task.category);
      const canAdvance = !!NEXT_COLUMN[task.status];
      const canRetreat = !!PREV_COLUMN[task.status];

      return (
        <div className="task-card">
          <div className="task-card-top">
            <span className="task-id">{task.id}</span>
            <button className="task-remove" onClick={() => onRemove(task.id)} title="Delete task" aria-label="Delete task">
              ×
            </button>
          </div>

          <h3 className="task-title">{task.title}</h3>

          {task.acceptanceCriteria && (
            <p className="task-criteria">{task.acceptanceCriteria}</p>
          )}

          <div className="task-tags">
            {priority && (
              <span className="chip" style={{ color: priority.color, background: priority.bg }}>
                {priority.id}
              </span>
            )}
            {category && (
              <span className="chip" style={{ color: category.color, background: category.bg }}>
                {category.id}
              </span>
            )}
          </div>

          <div className="task-footer">
            <span className="task-assignee" title={task.assignee}>
              {initials(task.assignee)}
            </span>
            <div className="task-actions">
              <button
                className="btn-icon"
                disabled={!canRetreat}
                onClick={() => onRetreat(task.id)}
                title="Move to previous column"
                aria-label="Move left"
              >
                ←
              </button>
              <button
                className="btn-icon"
                disabled={!canAdvance}
                onClick={() => onAdvance(task.id)}
                title="Move to next column"
                aria-label="Move right"
              >
                →
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Column({ column, tasks, onAdvance, onRetreat, onRemove }) {
      return (
        <div className="column">
          <div className="column-header">
            <span className={`column-dot dot-${column.id}`} />
            <h2>{column.label}</h2>
            <span className="column-count">{tasks.length}</span>
          </div>

          <div className="column-body">
            {tasks.length === 0 && <p className="column-empty">No tasks here</p>}
            {tasks.map((task) => (
              <TaskCard
                key={task.id}
                task={task}
                onAdvance={onAdvance}
                onRetreat={onRetreat}
                onRemove={onRemove}
              />
            ))}
          </div>
        </div>
      );
    }

    function CreateTaskModal({ onClose, onCreate }) {
      const [form, setForm] = React.useState({
        title: "",
        acceptanceCriteria: "",
        priority: "Medium",
        category: "Backend",
        assignee: "",
      });
      const [error, setError] = React.useState("");

      function update(field, value) {
        setForm((f) => ({ ...f, [field]: value }));
      }

      function handleSubmit(e) {
        e.preventDefault();
        if (!form.title.trim()) {
          setError("Give the task a title.");
          return;
        }
        onCreate(form);
      }

      return (
        <div className="modal-overlay" onMouseDown={onClose}>
          <div className="modal" onMouseDown={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2>+ Create Task</h2>
              <button className="modal-close" onClick={onClose} aria-label="Close">×</button>
            </div>

            <form onSubmit={handleSubmit} className="modal-form">
              <label className="field">
                <span>Task title</span>
                <input
                  autoFocus
                  value={form.title}
                  onChange={(e) => update("title", e.target.value)}
                  placeholder="e.g. Add rate limiting to auth endpoint"
                />
              </label>

              <label className="field">
                <span>Acceptance criteria</span>
                <textarea
                  rows={3}
                  value={form.acceptanceCriteria}
                  onChange={(e) => update("acceptanceCriteria", e.target.value)}
                  placeholder="What does 'done' look like?"
                />
              </label>

              <div className="field-row">
                <label className="field">
                  <span>Priority</span>
                  <select value={form.priority} onChange={(e) => update("priority", e.target.value)}>
                    {PRIORITIES.map((p) => (
                      <option key={p.id} value={p.id}>{p.id}</option>
                    ))}
                  </select>
                </label>

                <label className="field">
                  <span>Category</span>
                  <select value={form.category} onChange={(e) => update("category", e.target.value)}>
                    {CATEGORIES.map((c) => (
                      <option key={c.id} value={c.id}>{c.id}</option>
                    ))}
                  </select>
                </label>
              </div>

              <label className="field">
                <span>Assignee</span>
                <input
                  value={form.assignee}
                  onChange={(e) => update("assignee", e.target.value)}
                  placeholder="e.g. Priya Menon"
                />
              </label>

              {error && <p className="form-error">{error}</p>}

              <div className="modal-actions">
                <button type="button" className="btn-secondary" onClick={onClose}>Cancel</button>
                <button type="submit" className="btn-primary">Add to Backlog</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function Header({ search, onSearch, activeFilters, onToggleFilter, onClearFilters, onCreateClick, taskCount }) {
      return (
        <header className="app-header">
          <div className="header-top">
            <div className="brand">
              <span className="brand-mark">⌘</span>
              <div>
                <h1>TASKFLOW PRO</h1>
                <p>{taskCount} task{taskCount === 1 ? "" : "s"} tracked</p>
              </div>
            </div>

            <button className="btn-primary create-btn" onClick={onCreateClick}>
              + Create Task
            </button>
          </div>

          <div className="header-controls">
            <div className="search-wrap">
              <span className="search-icon">⌕</span>
              <input
                value={search}
                onChange={(e) => onSearch(e.target.value)}
                placeholder="Search tasks by title or assignee…"
                className="search-input"
              />
              {search && (
                <button className="search-clear" onClick={() => onSearch("")} aria-label="Clear search">×</button>
              )}
            </div>

            <div className="filter-chips">
              {PRIORITIES.map((p) => (
                <button
                  key={p.id}
                  onClick={() => onToggleFilter("priority", p.id)}
                  className={`filter-chip ${activeFilters.priority.has(p.id) ? "active" : ""}`}
                  style={
                    activeFilters.priority.has(p.id)
                      ? { color: p.color, background: p.bg, borderColor: p.color }
                      : undefined
                  }
                >
                  {p.id}
                </button>
              ))}
              <span className="chip-divider" />
              {CATEGORIES.map((c) => (
                <button
                  key={c.id}
                  onClick={() => onToggleFilter("category", c.id)}
                  className={`filter-chip ${activeFilters.category.has(c.id) ? "active" : ""}`}
                  style={
                    activeFilters.category.has(c.id)
                      ? { color: c.color, background: c.bg, borderColor: c.color }
                      : undefined
                  }
                >
                  {c.id}
                </button>
              ))}
              {(activeFilters.priority.size > 0 || activeFilters.category.size > 0) && (
                <button className="filter-chip clear" onClick={onClearFilters}>
                  Clear filters
                </button>
              )}
            </div>
          </div>
        </header>
      );
    }

    function App() {
      const [tasks, setTasks] = React.useState(() => {
        try {
          const raw = localStorage.getItem("taskflow_tasks");
          return raw ? JSON.parse(raw) : SEED_TASKS;
        } catch {
          return SEED_TASKS;
        }
      });

      const [search, setSearch] = React.useState("");
      const [modalOpen, setModalOpen] = React.useState(false);
      const [filters, setFilters] = React.useState({ priority: new Set(), category: new Set() });

      React.useEffect(() => {
        try {
          localStorage.setItem("taskflow_tasks", JSON.stringify(tasks));
        } catch {}
      }, [tasks]);

      function toggleFilter(kind, value) {
        setFilters((prev) => {
          const next = new Set(prev[kind]);
          if (next.has(value)) next.delete(value);
          else next.add(value);
          return { ...prev, [kind]: next };
        });
      }

      function clearFilters() {
        setFilters({ priority: new Set(), category: new Set() });
      }

      function handleCreate(form) {
        const task = {
          id: nextTaskId(tasks),
          title: form.title.trim(),
          acceptanceCriteria: form.acceptanceCriteria.trim(),
          priority: form.priority,
          category: form.category,
          assignee: form.assignee.trim() || "Unassigned",
          status: "backlog",
          createdAt: Date.now(),
        };
        setTasks((prev) => [task, ...prev]);
        setModalOpen(false);
      }

      function handleAdvance(id) {
        setTasks((prev) =>
          prev.map((t) => (t.id === id && NEXT_COLUMN[t.status] ? { ...t, status: NEXT_COLUMN[t.status] } : t))
        );
      }

      function handleRetreat(id) {
        setTasks((prev) =>
          prev.map((t) => (t.id === id && PREV_COLUMN[t.status] ? { ...t, status: PREV_COLUMN[t.status] } : t))
        );
      }

      function handleRemove(id) {
        setTasks((prev) => prev.filter((t) => t.id !== id));
      }

      const visibleTasks = React.useMemo(() => {
        const q = search.trim().toLowerCase();
        return tasks.filter((t) => {
          if (q) {
            const inTitle = t.title.toLowerCase().includes(q);
            const inAssignee = t.assignee.toLowerCase().includes(q);
            const inId = t.id.toLowerCase().includes(q);
            if (!inTitle && !inAssignee && !inId) return false;
          }
          if (filters.priority.size > 0 && !filters.priority.has(t.priority)) return false;
          if (filters.category.size > 0 && !filters.category.has(t.category)) return false;
          return true;
        });
      }, [tasks, search, filters]);

      return (
        <div className="app">
          <Header
            search={search}
            onSearch={setSearch}
            activeFilters={filters}
            onToggleFilter={toggleFilter}
            onClearFilters={clearFilters}
            onCreateClick={() => setModalOpen(true)}
            taskCount={tasks.length}
          />

          <main className="board">
            {COLUMNS.map((col) => (
              <Column
                key={col.id}
                column={col}
                tasks={visibleTasks.filter((t) => t.status === col.id)}
                onAdvance={handleAdvance}
                onRetreat={handleRetreat}
                onRemove={handleRemove}
              />
            ))}
          </main>

          {modalOpen && (
            <CreateTaskModal
              onClose={() => setModalOpen(false)}
              onCreate={handleCreate}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
